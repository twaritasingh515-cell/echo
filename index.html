    <script>
      // Prevent benign Vite dev HMR websocket notices from surfacing as unhandled rejection banners
      window.addEventListener('unhandledrejection', function(event) {
        var str = (event && event.reason && (event.reason.message || event.reason.stack || '' + event.reason)) || '';
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1 || str.indexOf('[vite]') !== -1) {
          event.preventDefault();
        }
      });
    </script>
